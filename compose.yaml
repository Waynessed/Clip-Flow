name: clipflow
x-app: &app
  build:
    context: .
    target: runtime
  environment: &env
    DATABASE_URL: postgres://clipflow:local-demo-password@db:5432/clipflow?sslmode=disable
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: clipflow
    S3_SECRET_KEY: local-demo-storage-password
    S3_BUCKET: clips
  depends_on:
    db:
      condition: service_healthy
    minio:
      condition: service_healthy
  restart: unless-stopped
services:
  db:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_USER: clipflow
      POSTGRES_PASSWORD: local-demo-password
      POSTGRES_DB: clipflow
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U clipflow -d clipflow"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    command: server /data
    environment:
      MINIO_ROOT_USER: clipflow
      MINIO_ROOT_PASSWORD: local-demo-storage-password
    volumes: [objects:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    <<: *app
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/readyz]
      interval: 2s
      timeout: 3s
      retries: 30
  worker:
    <<: *app
    entrypoint: [worker]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  web:
    build: ./web
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api:
        condition: service_healthy
  tools:
    <<: *app
    profiles: [tools]
    restart: 'no'
  verify:
    <<: *app
    build:
      context: .
      target: verify
    profiles: [test]
    volumes:
      - .:/src
      - test-cache:/root/.cache/go-build
    environment:
      <<: *env
      TEST_DATABASE_URL: postgres://clipflow:local-demo-password@db:5432/clipflow?sslmode=disable
    restart: 'no'
volumes:
  database:
  objects:
  test-cache:
